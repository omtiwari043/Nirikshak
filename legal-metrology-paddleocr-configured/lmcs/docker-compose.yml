version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lmcs
      POSTGRES_USER: lmcs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - lmcs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmcs_user -d lmcs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lmcs_net

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in your .env file}
      DATABASE_URL: postgresql://lmcs_user:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/lmcs
      OCR_LANG: en
      OCR_USE_GPU: "false"
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    volumes:
      - lmcs_uploads:/app/storage/uploads
      - lmcs_reports:/app/storage/reports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lmcs_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - lmcs_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  lmcs_net:
    driver: bridge

volumes:
  lmcs_pg_data:
  lmcs_uploads:
  lmcs_reports: